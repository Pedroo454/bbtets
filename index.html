<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Barbearia Julio Caetano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap">
<style>
/* Layout: app escuro mobile-first. Barra inferior fixa fica fora do conteúdo animado; formulários abrem em folhas (bottom sheets). Números sempre em Manrope tabular. */
:root{
  color-scheme:dark;
  --bg:#080808; --bg2:#141414; --card:#141414; --card2:#202020; --line:rgba(255,255,255,.09);
  --y:#FFD400; --y-ink:#0b0b0b; --fg:#ffffff; --mut:#A1A1A1; --mut2:#6f6f6f;
  --ok:#3ddc84; --warn:#ff9f43; --info:#4da3ff; --bad:#ff5c5c; --miss:#b58cff;
  --f-display:'Syne','Manrope',system-ui,sans-serif; --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:22px; --r-sm:14px; --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:var(--gut);padding-right:var(--gutr);overflow-x:hidden}
body.lock{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;width:100%;min-width:0;min-height:50px}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);outline-offset:1px}
button:focus-visible,a:focus-visible{outline:2px solid var(--y);outline-offset:3px;border-radius:12px}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.price,.kpi b,.sum b,.sr.tot b,.ap .t,.sl,.dy,.promo .big,.mini-in,.rate b{font-family:var(--f-body);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.wrap{max-width:1080px;margin:0 auto}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;font-size:12px;color:var(--mut)}
.demo b{color:var(--y);letter-spacing:.08em;font-weight:700}
.demo button{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12px;color:var(--fg);min-height:36px}
.demo button:hover{border-color:var(--y);color:var(--y)}
main{padding-bottom:140px;min-height:70vh;animation:fadeo .3s ease both}
.view{animation:fade .35s ease both}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*70ms)}
.sk{background:linear-gradient(100deg,#141414 30%,#242424 50%,#141414 70%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:var(--r)}
@keyframes sh{to{background-position:-200% 0}}

.top{display:flex;align-items:center;gap:12px;padding:8px 0 18px}
.logo{width:48px;height:48px;border-radius:15px;background:var(--y);color:var(--y-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.04em;flex:none;box-shadow:0 6px 22px rgba(255,212,0,.25)}
.top small{display:block;color:var(--mut);font-size:12.5px}
.top h2{font-size:19px}
.top>div:nth-child(2){min-width:0}
.top .sp{flex:1}
.ib{width:48px;height:48px;border-radius:15px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:.2s}
.ib:hover{border-color:var(--y);color:var(--y)}
.ib[disabled]{opacity:.35;pointer-events:none}
.av-btn{background:var(--card2);font-family:var(--f-display);font-weight:800;color:var(--y);font-size:18px}

.hero{position:relative;border-radius:30px;overflow:hidden;min-height:440px;display:flex;align-items:flex-end;isolation:isolate;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,8,8,.1) 25%,rgba(8,8,8,.88) 82%,#080808)}
.hero-in{padding:24px 22px 24px;width:100%}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--y);font-weight:700}
.hero h1{font-size:clamp(30px,8.4vw,46px);margin:8px 0 10px}
.hero p{color:#d6d6d6;max-width:34ch;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:18px;background:var(--y);color:var(--y-ink);font-weight:800;letter-spacing:.04em;font-size:14.5px;transition:transform .15s,box-shadow .2s,filter .2s;box-shadow:0 8px 26px rgba(255,212,0,.22)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--bg2);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--y);color:var(--y)}
.btn.danger{background:#2a1212;color:var(--bad);border:1px solid rgba(255,92,92,.35);box-shadow:none}
.btn.sm{min-height:46px;padding:0 18px;border-radius:14px;font-size:13.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);font-size:12.5px;color:#e8e8e8}
.chip svg{width:15px;height:15px}

.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h3{font-size:20px}
.link{color:var(--mut);font-size:13px;font-weight:600;min-height:40px;padding:0 4px}
.link:hover{color:var(--y)}
.hs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--gutr)*-1) 0 calc(var(--gut)*-1);padding:2px var(--gutr) 8px var(--gut);scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pic{width:100%;display:block;object-fit:cover}
.mini{width:230px;display:flex;flex-direction:column;transition:transform .25s,border-color .25s;text-align:left}
.mini:hover{transform:translateY(-3px);border-color:rgba(255,212,0,.5)}
.mini .pic{height:150px}
.mini .b{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.mini h4{font-size:16px}
.meta{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;flex-wrap:wrap}
.meta svg{width:15px;height:15px}
.price{font-weight:800;color:var(--y);font-size:18px;letter-spacing:-.01em}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tm{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:3/4.1;text-align:left;border:1px solid var(--line);transition:border-color .25s,transform .25s;background:var(--bg2);isolation:isolate}
.tm:hover{border-color:var(--y);transform:translateY(-3px)}
.tm img,.tm .ph0{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.tm .ph0{display:grid;place-items:center;color:var(--mut2)}
.tm::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 45%,rgba(8,8,8,.92))}
.tm div.t{position:absolute;left:0;right:0;bottom:0;padding:10px 10px 12px}
.tm b{font-family:var(--f-display);font-size:15px;display:block}
.tm span{font-size:11.5px;color:var(--mut);display:block;line-height:1.3}
.rate{display:inline-flex;align-items:center;gap:4px;color:var(--y);font-size:12.5px}
.rate svg{width:14px;height:14px;fill:currentColor;stroke:none}
.rate b{color:var(--fg);font-weight:800}
.rate small{color:var(--mut)}
.promo{display:grid;grid-template-columns:1fr;gap:0}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(255,212,0,.14);color:var(--y)}
.tag.ex{background:rgba(255,255,255,.08);color:var(--mut)}
.promo .b{padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.promo h4{font-size:22px}
.promo .big{font-weight:800;font-size:30px;color:var(--y)}
.promo s{color:var(--mut2);font-size:15px;margin-left:8px;font-weight:500}
.rev{width:280px;padding:18px;display:flex;flex-direction:column;gap:10px}
.stars{display:flex;gap:2px;color:var(--y)}
.stars svg{width:16px;height:16px;fill:currentColor;stroke:none}
.stars svg.off{color:var(--card2)}
.rev p{color:#d9d9d9;font-size:14px}
.rev small{color:var(--mut)}
.local{display:grid;gap:14px}
.map{position:relative;height:190px;background:#101010;overflow:hidden}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);color:var(--y)}
.map .pin svg{width:44px;height:44px;fill:var(--y);stroke:var(--y-ink);filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.info-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.info-row:last-child{border:0}
.info-row svg{color:var(--y);margin-top:2px}
.info-row b{display:block;font-size:14px}
.info-row span{color:var(--mut);font-size:13.5px}
.ph{color:var(--mut2);font-style:italic}
.foot{margin-top:34px;padding:18px 0;color:var(--mut2);font-size:12px;text-align:center}
.banner{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:16px;border-color:rgba(255,212,0,.4);background:#1a1700;text-align:left;width:100%}
.banner b{display:block;font-size:14.5px}
.banner span{color:var(--mut);font-size:13px}
.banner svg{color:var(--y)}

/* barras fixas (fora do <main>) */
.nav,.bar,.anav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:28px var(--gutr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut);pointer-events:none;background:linear-gradient(180deg,rgba(8,8,8,0),rgba(8,8,8,.92) 55%)}
.nav-in{pointer-events:auto;display:flex;gap:4px;background:rgba(24,24,24,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;padding:8px;width:100%;max-width:480px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.nv{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;flex:1 1 0;border-radius:20px;color:var(--mut);transition:flex .25s,background .25s;min-width:0}
.nv span.l{display:none;font-weight:700;font-size:14px;white-space:nowrap;padding-right:12px}
.nv.on{flex:2.4 1 0;background:var(--card2);color:var(--fg);justify-content:flex-start;padding-left:6px}
.nv.on .ico{background:var(--y);color:var(--y-ink)}
.nv.on span.l{display:block}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;transition:.25s}
.bar-in{pointer-events:auto;width:100%;max-width:560px;background:rgba(14,14,14,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 6px;font-size:13px;color:var(--mut)}
.sum b{color:var(--fg);font-size:17px;font-weight:800}
body.kb .nav,body.kb .bar,body.kb .anav,body.kb .fab{display:none}
.fab{position:fixed;right:var(--gutr);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;align-items:center;gap:8px;min-height:56px;padding:0 20px;border-radius:20px;background:var(--y);color:var(--y-ink);font-weight:800;font-size:14px;box-shadow:0 14px 34px rgba(0,0,0,.55),0 8px 22px rgba(255,212,0,.25)}
.fab:active{transform:scale(.97)}

.ph1{padding:6px 0 18px}
.ph1 h1{font-size:30px}
.ph1 p{color:var(--mut);margin-top:6px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fl{flex:none;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--mut);font-weight:600;font-size:13.5px;min-height:44px;transition:.2s}
.fl.on{background:var(--y);color:var(--y-ink);border-color:var(--y)}
.list{display:grid;gap:12px;grid-template-columns:1fr}
.svc{display:flex;gap:14px;padding:12px;align-items:stretch;text-align:left;width:100%;transition:border-color .2s,background .2s}
.svc .th{width:92px;min-height:92px;border-radius:16px;overflow:hidden;background:var(--card2);flex:none;display:grid;place-items:center;color:var(--mut2)}
.svc .th img{width:100%;height:100%;object-fit:cover}
.svc .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.svc h4{font-size:16px}
.svc p{color:var(--mut);font-size:13px;line-height:1.4}
.svc.sel{border-color:var(--y);background:#1a1700}
.chk{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--mut2);display:grid;place-items:center;flex:none;transition:.2s;align-self:center}
.sel .chk{background:var(--y);border-color:var(--y);color:var(--y-ink)}
.chk svg{width:16px;height:16px;stroke-width:3;opacity:0}
.sel .chk svg{opacity:1}
.bcard{overflow:hidden;display:flex;flex-direction:column}
.bcard .ph-img{height:300px;position:relative;isolation:isolate;background:var(--card2);display:grid;place-items:center;color:var(--mut2)}
.bcard .ph-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.bcard .ph-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,var(--card))}
.bcard .bd{padding:4px 18px 18px;display:flex;flex-direction:column;gap:10px}
.bcard h3{font-size:24px}
.bcard .role{color:var(--y);font-weight:700;font-size:13px}
.bcard p{color:#cfcfcf;font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--card2);color:#cfcfcf}
.avail{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}

.bk-top{display:flex;align-items:center;gap:12px;padding:8px 0 6px}
.bk-top h2{font-size:20px;flex:1;text-align:center;margin-right:48px}
.prog{display:flex;gap:6px;margin:10px 0 22px}
.prog i{flex:1;height:5px;border-radius:5px;background:var(--card2);transition:.4s}
.prog i.on{background:var(--y)}
.stepcap{color:var(--mut);font-size:13px;margin-bottom:4px}
.q{font-size:26px;margin-bottom:16px}
.lead{color:var(--mut);margin:-6px 0 20px}
.opt{display:flex;gap:14px;align-items:center;padding:12px;width:100%;text-align:left;transition:.2s}
.opt .av{width:64px;height:64px;border-radius:18px;overflow:hidden;background:var(--card2);flex:none;display:grid;place-items:center;color:var(--y)}
.opt .av img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.opt b{font-size:16px;display:block;font-family:var(--f-display)}
.opt span{color:var(--mut);font-size:13px}
.opt.sel{border-color:var(--y);background:#1a1700}
.opt.dis{opacity:.4;pointer-events:none}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-h h3{font-size:20px}
.cal-h div{display:flex;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;text-align:center;color:var(--mut);padding:6px 0;font-weight:700}
.dy{aspect-ratio:1;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-weight:700;transition:background .2s,transform .2s;font-size:15px;min-width:0;position:relative}
.dy:hover:not([disabled]){background:#2c2c2c}
.dy[disabled]{background:repeating-linear-gradient(135deg,#141414,#141414 4px,#1b1b1b 4px,#1b1b1b 8px);color:var(--mut2);font-weight:500;cursor:not-allowed}
.dy.today::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--y)}
.dy.on{background:var(--y);color:var(--y-ink);box-shadow:0 6px 18px rgba(255,212,0,.3)}
.dy.on::after{background:var(--y-ink)}
.dy.empty{visibility:hidden}
.legend{display:flex;gap:16px;margin-top:14px;color:var(--mut);font-size:12.5px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.per{margin:18px 0 8px;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sl{min-height:52px;border-radius:14px;background:var(--card2);font-weight:800;transition:.2s;font-size:15px}
.sl:hover{background:#2c2c2c}
.sl.on{background:var(--y);color:var(--y-ink)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label,.lbl{font-size:13px;color:var(--mut);font-weight:600}
.sumcard{padding:18px;display:flex;flex-direction:column}
.sr{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dashed var(--line)}
.sr:last-child{border:0}
.sr span{color:var(--mut);font-size:13.5px}
.sr b{text-align:right;font-weight:700;font-size:14.5px;min-width:0}
.sr.tot b{color:var(--y);font-size:22px;font-weight:800}
.note{color:var(--mut);font-size:12.5px;margin-top:12px}
.ok-ring{width:92px;height:92px;border-radius:50%;background:var(--y);color:var(--y-ink);display:grid;place-items:center;margin:10px auto 18px;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.ok-ring svg{width:46px;height:46px;stroke-width:3}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.center{text-align:center}
.stack{display:grid;gap:10px}
.empty-st{padding:30px 20px;text-align:center;color:var(--mut)}
.empty-st b{display:block;color:var(--fg);font-family:var(--f-display);font-size:18px;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.s-pendente{--c:var(--warn)}.s-confirmado{--c:var(--info)}.s-concluido{--c:var(--ok)}.s-cancelado{--c:var(--bad)}.s-faltou{--c:var(--miss)}

/* login */
.auth{max-width:440px;margin:0 auto}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:56px;border-radius:18px;background:#fff;color:#1f1f1f;font-weight:700;font-size:15px;transition:.15s}

const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ===== agenda ===== */
const cache=new Map(); const bust=()=>cache.clear();
function seeded(bid,ds){
  const k=bid+ds; if(cache.has(k))return cache.get(k);
  const d=pdate(ds), b=BB.find(x=>x.id===bid), out=[];
  const pool=b?b.svc.map(svcById).filter(s=>s&&s.on):[];
  if(false && b&&b.on&&pool.length&&OPEN.days.includes(d.getDay())&&!b.off.includes(d.getDay())){
    const r=rng(hash(k)), n=Date.now(); let i=Math.floor(r()*2);
    while(i<NB){
      const s=pool[Math.floor(r()*pool.length)], blocks=Math.ceil(s.dur/30);
      if(i+blocks>NB)break;
      const start=OPEN.start+i*30, at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,start).getTime();
      const past=at<n, q=r(); let st;
      if(past)st=q<.07?'cancelado':q<.12?'faltou':'concluido'; else st=q<.05?'cancelado':q<.35?'pendente':'confirmado';
      out.push({key:`${bid}|${ds}|${start}`,bid,ds,start,blocks,dur:s.dur,names:s.name,svcIds:[s.id],price:s.price,client:NAMES[Math.floor(r()*NAMES.length)],phone:`(11) 9${String(Math.floor(r()*9000)+1000)}-${String(Math.floor(r()*9000)+1000)}`,status:st,paid:st==='concluido'&&r()<.9,user:false});
      i+=blocks+Math.floor(r()*4)+(r()<.35?0:1);
    }
  }
  cache.set(k,out);return out;
}
const stOf=a=>S.ov[a.key]||a.status;
function dayAppts(ds){
  const all=[];
  BB.forEach(b=>seeded(b.id,ds).forEach(a=>all.push({...a,status:stOf(a)})));
  S.bookings.filter(x=>x.date===ds).forEach(x=>all.push({key:x.id,bid:x.bid,ds,start:x.time,blocks:Math.ceil(x.dur/30),dur:x.dur,names:x.names,svcIds:x.svcIds||[],price:x.total,client:x.name,phone:x.phone,status:x.status,paid:false,user:true,by:x.by}));
  return all.sort((a,b)=>a.start-b.start||a.bid.localeCompare(b.bid));
}
const blocksBusy=(bid,ds)=>{const s=new Set();S.busySlots.filter(a=>a.barber_id===bid&&a.appointment_date===ds&&a.status!=='cancelado').forEach(a=>{for(let t=a.start_minute;t<a.end_minute;t+=30)s.add(Math.floor((t-OPEN.start)/30))});return s};
const eligible=(svcs,pref)=>BB.filter(b=>b.on&&svcs.every(id=>b.svc.includes(id))&&(pref==='any'||b.id===pref));
function slotsFor(ds,svcs,pref,dur,admin){
  const d=pdate(ds), out=[]; if(!svcs.length||!OPEN.days.includes(d.getDay())||ds<today())return out;
  const need=Math.ceil(dur/30), el=eligible(svcs,pref).filter(b=>!b.off.includes(d.getDay()));
  const busy=Object.fromEntries(el.map(b=>[b.id,blocksBusy(b.id,ds)]));
  for(let i=0;i+need<=NB;i++){
    const t=OPEN.start+i*30; if(ds===today()&&t<nowMin()+(admin?0:30))continue;
    for(const b of el){let free=true;for(let j=0;j<need;j++)if(busy[b.id].has(i+j)){free=false;break}if(free){out.push({t,bid:b.id});break}}
  }
  return out;
}

const TABS=[['dash','Painel','grid'],['agenda','Agenda','cal'],['serv','Serviços','scissors'],['barb','Equipe','user'],['cli','Clientes','users'],['fin','Financeiro','cash'],['cfg','Configurações','cog']];
function range(n){const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push(dstr(d))}return o}
function metrics(n){
  const ds=range(n), per={rev:0,done:0,canc:0,faltas:0,svc:{},bar:{},days:[]};
  ds.forEach(d=>{let rev=0;dayAppts(d).forEach(a=>{if(a.status==='cancelado')per.canc++;else if(a.status==='faltou')per.faltas++;if(a.status==='concluido'){per.done++;rev+=a.price;per.bar[a.bid]=(per.bar[a.bid]||0)+a.price}
    if(a.status!=='cancelado')a.names.split(' + ').forEach(nm=>per.svc[nm]=(per.svc[nm]||0)+1)});per.rev+=rev;per.days.push([d,rev])});
  return per}

  let body={dash:aDash,agenda:aAgenda,serv:aServ,barb:aBarb,cli:aCli,fin:aFin,cfg:aCfg}[S.tab]();
  return`<div class="top"><div class="logo">JC</div><div><small>Painel do proprietário</small><h2>${esc(S.cfg.name)}</h2></div><div class="sp"></div><button class="ib" data-a="logout" aria-label="Sair do painel">${ic('out')}</button></div><div class="adm"><nav class="atabs" aria-label="Seções do painel">${TABS.map(t=>`<button class="at ${S.tab===t[0]?'on':''}" data-a="tab" data-t="${t[0]}">${ic(t[2])}${t[1]}</button>`).join('')}</nav><div class="view" key="${S.tab}" style="min-width:0;display:grid;gap:14px">${body}</div></div>`}
function aDash(){

  <div class="card panel"><div class="row-between" style="margin-bottom:14px"><h3 style="margin:0">Faturamento por dia</h3><div class="seg" role="group" aria-label="Período">${[7,30].map(n=>`<button class="${S.period===n?'on':''}" data-a="period" data-n="${n}">${n} dias</button>`).join('')}</div></div>
   <div class="chart" role="img" aria-label="Faturamento dos últimos ${S.period} dias: total ${brl(m.rev)}">${m.days.map(d=>`<i class="${d[1]?'':'z'}" style="height:${d[1]?Math.max(4,d[1]/mx*100):3}%" title="${pdate(d[0]).toLocaleDateString('pt-BR')}: ${brl(d[1])}"></i>`).join('')}</div><div class="chart-x num"><span>${pdate(m.days[0][0]).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</span><span>Total ${brl(m.rev)}</span><span>Hoje</span></div></div>

async function handleAuthSession(session){
 authSession=session;
 if(!session){S.user=null;S.profile=null;S.adminAuth=false;S.bookings=[];S.reviews=[];return;}
 const [p,factors,aal]=await Promise.all([sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle(),sb.auth.mfa.listFactors(),sb.auth.mfa.getAuthenticatorAssuranceLevel()]);
 const verified=(factors.data?.all||[]).find(x=>x.factor_type==='phone'&&x.status==='verified');
 S.auth.name=p.data?.full_name||session.user.user_metadata?.full_name||session.user.email?.split('@')[0]||'Cliente';
 S.auth.email=session.user.email||'';
 if(p.data){S.profile=p.data;S.auth.phone=p.data.phone;}
 if(verified&&aal.data?.nextLevel==='aal2'&&aal.data?.currentLevel!=='aal2'){
  factorId=verified.id;const ch=await sb.auth.mfa.challenge({factorId,channel:'whatsapp'});
  if(!ch.error){challengeId=ch.data.id;S.auth.step='code';S.auth.code='';S.auth.err='';S.user=null;}
 }else if(verified&&aal.data?.currentLevel==='aal2'&&p.data){S.user={name:p.data.full_name,email:session.user.email,phone:p.data.phone,gender:p.data.gender,birth_date:p.data.birth_date,avatar_seed:p.data.avatar_seed};}
 else{S.auth.step='phone';S.user=null;}
 await loadCloudData();
}
async function boot(){
 if(!sb){S.loading=false;setView(location.hash.slice(1)||'home');return;}
 await loadPublicData();
 const r=await sb.auth.getSession();await handleAuthSession(r.data.session);
 sb.auth.onAuthStateChange(async(_event,session)=>{await handleAuthSession(session);if(session&&!S.user){if(location.hash!=='#entrar')location.hash='entrar';render()}else if(!session)render()});
 S.loading=false;setView(location.hash.slice(1)||'home');
}
function closeSheetSilent(){if(S.sheet){S.sheet=null;S.delc=null;renderSheet()}}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset,b=S.book,sh=S.sheet;
  switch(a){
   case'go':if(d.v==='agendar'&&b.done)resetBook();closeSheetSilent();go(d.v);break;
   case'start':resetBook();go('agendar');break;
   case'login':S.next='home';S.auth={step:'google',gform:false,name:'',email:'',phone:'',code:'',err:''};go('entrar');break;
   case'quick':resetBook([d.id]);if(eligible([d.id],'any').length)S.book.step=2;go('agendar');if(S.view==='agendar')render();break;
   case'withbarber':resetBook();S.book.barber=d.id;go('agendar');if(S.view==='agendar')render();break;
   case'cat':S.cat=d.c;render();break;
   case'togsvc':{const i=b.svcs.indexOf(d.id);i>=0?b.svcs.splice(i,1):b.svcs.push(d.id);if(b.barber!=='any'&&!eligible(b.svcs,b.barber).length)b.barber='any';b.date=null;b.time=null;render();break}
   case'pickbar':b.barber=d.id;b.date=null;b.time=null;render();break;
   case'cal':S.cal.m+=+d.n;if(S.cal.m<0){S.cal.m=11;S.cal.y--}if(S.cal.m>11){S.cal.m=0;S.cal.y++}render();break;
   case'pickday':b.date=d.d;b.time=null;render();break;
   case'picktime':b.time=+d.t;b.bid=d.b;render();break;
   case'next':if(!canNext())break;if(b.step===5){confirmBook();break}
     if(b.step===4){const t=totals(b.svcs);const s=slotsFor(b.date,b.svcs,b.barber,t.dur).find(s=>s.t===b.time&&(b.barber==='any'||s.bid===b.barber));if(s)b.bid=s.bid}
     b.step++;render();window.scrollTo({top:0});break;
   case'back':if(b.done){go('home');break}if(b.resched&&b.step<=3){go('meus');break}if(b.step>1){b.step--;render();window.scrollTo({top:0})}else go('home');break;
   /* conta */
   case'gopen':startGoogleLogin();break;
   case'authback':{const st=S.auth.step;if(st==='code'){S.auth.step='phone';S.auth.code='';S.auth.err=''}else if(st==='phone'){S.auth.step='google';S.auth.err=''}else{go('home');break}render();break}
   case'verify':verifyPhoneChallenge();break;
   case'resend':sendPhoneChallenge();break;
   case'editphone':S.auth.step='phone';S.auth.code='';S.auth.err='';render();break;
   case'logout-c':sb.auth.signOut().then(()=>{toast('Você saiu da conta.');go('home')});break;
   /* meus */
   case'cancel':{if(S.cc!==d.id){S.cc=d.id;render();break}const x=S.bookings.find(y=>y.id===d.id);if(x&&canChange(x)){x.status='cancelado';persist();S.cc=null;toast('Agendamento cancelado.')}else toast('Prazo de cancelamento encerrado.');render();break}
   case'resched':{const x=S.bookings.find(y=>y.id===d.id);if(!x)break;if(!canChange(x)){toast('Prazo para remarcar encerrado.');break}
     resetBook(x.svcIds&&x.svcIds.length?x.svcIds:[]);S.book.barber=x.bid;S.book.step=3;S.book.resched=x.id;go('agendar');if(S.view==='agendar')render();break}
   case'review':openSheet({t:'review',bk:d.id,stars:0,text:''});break;
   case'sh-star':sh.stars=+d.n;renderSheet();break;
   case'rv-save':{const x=S.bookings.find(y=>y.id===sh.bk);S.reviews.push({id:uid('r'),bk:sh.bk,bid:x.bid,stars:sh.stars,text:sh.text.trim(),name:(S.user?S.user.name.split(' ')[0]:'Cliente'),date:today()});persist();closeSheet();toast('Obrigado pela avaliação!');render();break}
   /* admin */
   case'adminlogin':if(ownerAccess)render();else startGoogleLogin();break;
   case'tab':S.tab=d.t;closeSheetSilent();render();window.scrollTo({top:0});break;
   case'more':openSheet({t:'more'});break;
   case'period':S.period=+d.n;render();break;
   case'adate':{const x=pdate(S.adate||today());x.setDate(x.getDate()+ +d.n);S.adate=dstr(x);render();break}
   case'st':S.ov[d.k]=d.s;{const u=S.bookings.find(y=>y.id===d.k);if(u)u.status=d.s}persist();toast('Status atualizado.');render();break;
   case'sent':S.sent[d.k]=Date.now();persist();setTimeout(render,80);break;
   case'newappt':openSheet({t:'appt',mode:'new',from:null,name:'',phone:'',svcs:[],barber:'any',date:S.adate&&S.adate>=today()?S.adate:today(),time:null,bid:null});break;
   case'resched-a':{const a2=dayAppts(S.adate||today()).find(x=>x.key===d.k);if(!a2)break;{const o={t:'appt',mode:'resched',from:a2.key,name:a2.client,phone:a2.phone,svcs:(a2.svcIds||[]).filter(id=>svcById(id)),barber:a2.bid,date:a2.ds>=today()?a2.ds:today(),time:null,bid:null};fixDate(o);openSheet(o)}break}
   case'sh-svc':{const i=sh.svcs.indexOf(d.id);i>=0?sh.svcs.splice(i,1):sh.svcs.push(d.id);if(sh.barber!=='any'&&!eligible(sh.svcs,sh.barber).length)sh.barber='any';sh.time=null;fixDate(sh);renderSheet();break}
   case'sh-bar':sh.barber=d.id;sh.time=null;fixDate(sh);renderSheet();break;
   case'sh-time':sh.time=+d.t;sh.bid=d.b;renderSheet();break;
   case'sh-save':saveAppt();break;
   case'svc-new':openSheet({t:'svc',id:null,name:'',cat:'Cortes',price:'',dur:'30',desc:'',img:null,on:1,pop:0,err:''});break;
   case'svc-edit':{const s=svcById(d.id);openSheet({t:'svc',id:s.id,name:s.name,cat:s.cat,price:moneyIn(s.price),dur:String(s.dur),desc:s.desc,img:s.img,on:s.on,pop:s.pop||0,err:''});break}
   case'svc-save':{const p=parseMoney(sh.price),du=parseInt(sh.dur,10);
     if(sh.name.trim().length<2){sh.err='Informe o nome do serviço.';renderSheet();break}
     if(isNaN(p)||p<0){sh.err='Informe um preço válido, por exemplo 45,00.';renderSheet();break}
     if(!du||du<5||du>480){sh.err='A duração deve ficar entre 5 e 480 minutos.';renderSheet();break}
     if(sh.id){Object.assign(svcById(sh.id),{name:sh.name.trim(),cat:sh.cat,price:p,dur:du,desc:sh.desc.trim(),img:sh.img,on:sh.on?1:0,pop:sh.pop?1:0})}
     else{let id=slug(sh.name),n=1;while(svcById(id))id=slug(sh.name)+'-'+(++n);SV.push({id,name:sh.name.trim(),cat:sh.cat,price:p,dur:du,desc:sh.desc.trim(),img:sh.img,on:sh.on?1:0,pop:sh.pop?1:0});BB.forEach(x=>{if(x.on)x.svc.push(id)})}
     bust();persist();closeSheet();toast('Serviço salvo. Já aparece no app.');render();break}
   case'del-svc':if(S.delc!==sh.id){S.delc=sh.id;renderSheet();break}
     if(sb){const {error}=await sb.from('services').delete().eq('id',sh.id);if(error){toast(error.message);break}}
     SV=SV.filter(x=>x.id!==sh.id);BB.forEach(x=>x.svc=x.svc.filter(i=>i!==sh.id));S.book.svcs=S.book.svcs.filter(i=>i!==sh.id);bust();persist();closeSheet();toast('Serviço removido.');render();break;
   case'bb-new':openSheet({t:'bb',id:null,name:'',role:'',bio:'',img:null,svc:SV.filter(x=>x.on).map(x=>x.id),off:[],on:1,err:''});break;
   case'bb-edit':{const x=barById(d.id);openSheet({t:'bb',id:x.id,name:x.name,role:x.role,bio:x.bio||'',img:x.img,svc:x.svc.slice(),off:x.off.slice(),on:x.on,err:''});break}
   case'bb-save':
     if(sh.name.trim().length<2){sh.err='Informe o nome do barbeiro.';renderSheet();break}
     if(sh.id){Object.assign(barById(sh.id),{name:sh.name.trim(),role:sh.role.trim(),bio:sh.bio.trim(),img:sh.img,svc:sh.svc,off:sh.off,on:sh.on?1:0})}
     else{let id=slug(sh.name),n=1;while(BB.find(x=>x.id===id))id=slug(sh.name)+'-'+(++n);BB.push({id,name:sh.name.trim(),role:sh.role.trim(),bio:sh.bio.trim(),img:sh.img,svc:sh.svc,off:sh.off,on:sh.on?1:0})}
     bust();persist();closeSheet();toast('Barbeiro salvo. Já aparece no app.');render();break;
   case'del-bb':if(S.delc!==sh.id){S.delc=sh.id;renderSheet();break}
     if(sb){const {error}=await sb.from('barbers').delete().eq('id',sh.id);if(error){toast(error.message);break}}
     BB=BB.filter(x=>x.id!==sh.id);bust();persist();closeSheet();toast('Barbeiro removido.');render();break;
   case'sh-bsvc':{const i=sh.svc.indexOf(d.id);i>=0?sh.svc.splice(i,1):sh.svc.push(d.id);renderSheet();break}
   case'sh-off':{const n=+d.d,i=sh.off.indexOf(n);i>=0?sh.off.splice(i,1):sh.off.push(n);renderSheet();break}
   case'sh-tog':sh[d.k]=sh[d.k]?0:1;renderSheet();break;
   case'sh-nophoto':sh.img=null;renderSheet();break;
   case'sx':closeSheet();break;
   case'savecfg':persist();toast('Configurações salvas. Já aparecem no app.');break;
   case'resetall':if(S.delc!=='reset'){S.delc='reset';render();break}
     SV=JSON.parse(JSON.stringify(DEF_SV));BB=JSON.parse(JSON.stringify(DEF_BB));S.bookings=[];S.reviews=[];S.ov={};S.sent={};S.exp=[{d:'Aluguel (exemplo)',v:180000},{d:'Produtos (exemplo)',v:42000}];S.cfg=Object.assign({},CFG0);S.delc=null;bust();persist();toast('Dados de exemplo restaurados.');render();break;
   case'logout':sb.auth.signOut().then(()=>{S.adminAuth=false;closeSheetSilent();go('home')});break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target,i=el.dataset.i;if(!i)return;
  if(i==='aname')S.auth.name=el.value;
  else if(i==='amail')S.auth.email=el.value;
  else if(i==='aphone'){el.value=phoneFmt(el.value);S.auth.phone=el.value}
  else if(i==='acode'){el.value=el.value.replace(/\D/g,'').slice(0,6);S.auth.code=el.value;S.auth.err='';const bt=document.querySelector('[data-a=verify]');if(bt)bt.disabled=el.value.length!==6;}
  else if(i==='cq'){S.cq=el.value;render()}
  else if(i==='cfg'){const k=el.dataset.k;S.cfg[k]=k==='minCancelH'?(parseInt(el.value,10)||0):el.value}
  else if(i==='sh'){S.sheet[el.dataset.k]=el.value;if(S.sheet.t==='appt'){const bt=document.querySelector('[data-a=sh-save]');if(bt)bt.disabled=!(S.sheet.name.trim().length>=2&&digits(S.sheet.phone).length>=10&&S.sheet.svcs.length&&S.sheet.time!=null)}}
  else if(i==='shphone'){el.value=phoneFmt(el.value);S.sheet.phone=el.value;const bt=document.querySelector('[data-a=sh-save]');if(bt)bt.disabled=!(S.sheet.name.trim().length>=2&&digits(S.sheet.phone).length>=10&&S.sheet.svcs.length&&S.sheet.time!=null)}
});
document.addEventListener('change',e=>{
  const el=e.target,i=el.dataset.i;if(!i)return;
  if(i==='shdate'){if(el.value&&el.value>=today()){S.sheet.date=el.value;S.sheet.time=null;renderSheet()}else toast('Escolha uma data de hoje em diante.')}
  if(i==='sh'&&el.tagName==='SELECT')S.sheet[el.dataset.k]=el.value;
  if(i==='photo'&&el.files&&el.files[0])readPhoto(el.files[0],u=>{S.sheet.img=u;renderSheet()});
});
document.addEventListener('submit',e=>{
 e.preventDefault();const id=e.target.id;
 if(id==='pf'){const x=S.auth;if(digits(x.phone).length<10){x.err='Digite o WhatsApp com DDD.';render();return}sendPhoneChallenge()}
 if(id==='profile-form')saveProfile(e);
 if(id==='ex'){const dd=$('#ex-d').value.trim(),v=parseMoney($('#ex-v').value);if(dd&&!isNaN(v)&&v>0){S.exp.push({d:dd,v});persist();render()}else toast('Preencha descrição e valor, por exemplo 120,50.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
/* esconde as barras fixas enquanto o teclado está aberto */
document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)&&!e.target.closest('.sh-p'))document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))document.body.classList.remove('kb')},60));
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)||'home'));
boot();
</script>

</body></html>
